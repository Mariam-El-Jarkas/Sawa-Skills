spring.application.name=demo
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SawaSkills}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# GitHub OAuth
github.client.id=${GITHUB_CLIENT_ID:}
github.client.secret=${GITHUB_CLIENT_SECRET:}

# JWT
jwt.secret=${JWT_SECRET:SawaSkillsSecretKey2024!ChangeThisInProductionToA256BitRandomString}

server.port=${PORT:8080}

# Base URL used in emails (change to your production domain)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Admin email — requests to /api/verification/admin/** require this principal
app.admin.email=${ADMIN_EMAIL:admin@sawa.com}

# ML microservice
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# Profile picture uploads
app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Backblaze B2 Storage
b2.keyId=${B2_KEY_ID:}
b2.applicationKey=${B2_APPLICATION_KEY:}
b2.endpoint=${B2_ENDPOINT:s3.eu-central-003.backblazeb2.com}
b2.bucketName=${B2_BUCKET_NAME:sawaskills-uploads}
b2.region=${B2_REGION:eu-central-003}